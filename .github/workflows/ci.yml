name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Start services
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Typecheck and tests
        run: docker compose --profile test run --rm -T tests

      - name: Distributed smoke test
        run: docker compose exec -T api bun run smoke:compose

      - name: Verify recovery after restart
        run: |
          docker compose restart api api2 api3
          docker compose up -d --wait --wait-timeout 180 --no-recreate api api2 api3
          docker compose exec -T api bun run smoke:compose check

      - name: Service logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200

      - name: Cleanup
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans
